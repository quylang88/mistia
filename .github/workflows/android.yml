name: Android contract and APK

on:
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - "Mistia/Localizable.xcstrings"
      - "Scripts/generate-android-l10n.swift"
      - "Scripts/check-android-contracts.swift"
      - "Mistia/Core/UI/MistiaFinanceIcons.swift"
      - "Mistia/Shared/CoreLogic/MistiaSystemCategories.json"
      - "Mistia/Assets.xcassets/**"
      - "Scripts/generate-android-finance-icons.cjs"
      - "Scripts/tests/android-finance-icons.test.cjs"
      - "docs/android/finance-icon-assets.generated.json"
      - "Mistia/Shared/CoreLogic/InvestmentLogic.swift"
      - "Scripts/generate-android-investment-unit-fold.swift"
      - "Scripts/tests/test_android_investment_unit_fold.py"
      - "docs/android/investment-unit-fold.generated.json"
      - "Tests/MistiaCoreLogicTests/InvestmentAccountingParityVectorTests.swift"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "contracts/**"
      - "Mistia/Localizable.xcstrings"
      - "Scripts/generate-android-l10n.swift"
      - "Scripts/check-android-contracts.swift"
      - "Mistia/Core/UI/MistiaFinanceIcons.swift"
      - "Mistia/Shared/CoreLogic/MistiaSystemCategories.json"
      - "Mistia/Assets.xcassets/**"
      - "Scripts/generate-android-finance-icons.cjs"
      - "Scripts/tests/android-finance-icons.test.cjs"
      - "docs/android/finance-icon-assets.generated.json"
      - "Mistia/Shared/CoreLogic/InvestmentLogic.swift"
      - "Scripts/generate-android-investment-unit-fold.swift"
      - "Scripts/tests/test_android_investment_unit_fold.py"
      - "docs/android/investment-unit-fold.generated.json"
      - "Tests/MistiaCoreLogicTests/InvestmentAccountingParityVectorTests.swift"

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Check localization generators
        run: |
          Scripts/generate-l10n.swift --input Mistia/Localizable.xcstrings --output Mistia/Shared/CoreLogic/L10n.generated.swift --check --strict-keys
          Scripts/generate-android-l10n.swift --check
      - name: Check shared finance icon artwork
        run: node Scripts/generate-android-finance-icons.cjs --check
      - name: Check Swift investment unit folding
        run: |
          swift Scripts/generate-android-investment-unit-fold.swift --check
          python3 Scripts/tests/test_android_investment_unit_fold.py
      - name: Verify Swift investment accounting vectors
        run: swift test --filter InvestmentAccountingParityVectorTests
      - name: Check cross-platform contracts
        run: Scripts/check-android-contracts.swift
      - name: Test and assemble APK 0
        working-directory: android
        run: ./gradlew testDebugUnitTest :core:model:compileDebugAndroidTestKotlin :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mistia-apk0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
